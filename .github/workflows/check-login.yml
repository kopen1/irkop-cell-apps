name: Check Login & Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check login source
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/irkop/cell/data/ApiService.kt"
          REPO="app/src/main/java/com/irkop/cell/data/Repository.kt"
          MAIN="app/src/main/java/com/irkop/cell/MainActivity.kt"

          echo "=== CEK FILE ==="
          test -f "$FILE" || { echo "ERROR: $FILE tidak ditemukan"; exit 1; }
          test -f "$REPO" || { echo "ERROR: $REPO tidak ditemukan"; exit 1; }
          test -f "$MAIN" || { echo "ERROR: $MAIN tidak ditemukan"; exit 1; }

          echo "=== CEK API BASE URL ==="
          grep -RInE 'https://konter\.irkop\.workers\.dev|BASE_URL|baseUrl' app/src/main/java || true

          echo "=== CEK ENDPOINT LOGIN ==="
          grep -RInE '@POST.*login|login\(' app/src/main/java/com/irkop/cell/data app/src/main/java/com/irkop/cell || true

          echo "=== CEK TOKEN/JWT ==="
          grep -RInE 'token|access_token|jwt|Authorization|Bearer' app/src/main/java/com/irkop/cell || true

          echo "=== CEK PERMINTAAN LOGIN ==="
          grep -RInE 'username|password|email' app/src/main/java/com/irkop/cell/data app/src/main/java/com/irkop/cell/ui app/src/main/java/com/irkop/cell/MainActivity.kt | head -100 || true

          echo "=== STATIC LOGIN CHECK SELESAI ==="

      - name: Check API connectivity
        shell: bash
        run: |
          set -e

          echo "=== CEK SERVER API ==="

          URL="https://konter.irkop.workers.dev/api/v1/"

          HTTP_CODE=$(curl -L -sS -o /tmp/api-response.txt \
            -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 30 \
            "$URL" || true)

          echo "HTTP STATUS: $HTTP_CODE"
          echo "RESPONSE:"
          head -c 1000 /tmp/api-response.txt || true
          echo

          if [ -z "$HTTP_CODE" ] || [ "$HTTP_CODE" = "000" ]; then
            echo "ERROR: Server API tidak dapat dihubungi."
            exit 1
          fi

          echo "API SERVER DAPAT DIJANGKAU."

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: login-check-debug-apk
          path: app/build/outputs/apk/debug/*.apk
