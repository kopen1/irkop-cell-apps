name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable CI signing key
        uses: actions/cache@v4
        with:
          path: app/.ci-signing/ci-debug.keystore
          key: irkop-cell-ci-debug-signing-v1

      - name: Create stable CI signing key when cache is empty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/.ci-signing
          if [ ! -f app/.ci-signing/ci-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/.ci-signing/ci-debug.keystore \
              -storepass irkopdebug \
              -keypass irkopdebug \
              -alias irkop \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Irkop Cell CI, OU=Development, O=Irkop Cell, L=Indonesia, ST=Indonesia, C=ID"
          fi

      - name: Calculate next release version
        shell: bash
        run: |
          set -euo pipefail
          LATEST_TAG="$(git tag --list 'v0.0.*' | sort -V | tail -n 1 || true)"
          if [ -z "$LATEST_TAG" ]; then
            VERSION_CODE=1
            VERSION_NAME="0.0.1"
          else
            LAST_CODE="${LATEST_TAG#v0.0.}"
            VERSION_CODE=$((LAST_CODE + 1))
            VERSION_NAME="0.0.${VERSION_CODE}"
          fi
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Building Irkop Cell ${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK ready: $APK"

      - name: Publish direct-install APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          gh release create "v${VERSION_NAME}" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Irkop Cell ${VERSION_NAME}" \
            --notes "Automatic Android build from main commit ${GITHUB_SHA}. Install the attached APK directly; no ZIP extraction is required."

      - uses: actions/upload-artifact@v4
        with:
          name: irkop-cell-debug-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
