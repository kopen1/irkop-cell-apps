name: Android Test Only

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Android tests - NO APK BUILD
    runs-on: ubuntu-latest

    env:
      API_BASE_URL: https://konter.irkop.workers.dev/api/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify source
        shell: bash
        run: |
          set -e

          echo "Checking forbidden /api/v1 references..."

          if grep -RIn \
            --exclude-dir=.git \
            --exclude='*.md' \
            'konter.irkop.workers.dev/api/v1' \
            .; then
            echo "ERROR: /api/v1 masih ditemukan."
            exit 1
          fi

          echo "Checking forbidden APK build commands..."

          if grep -RInE \
            --exclude-dir=.git \
            'assembleDebug|assembleRelease|bundleRelease|assemble.*Android' \
            .github/workflows; then
            echo "ERROR: workflow masih mengandung APK build."
            exit 1
          fi

          echo "Source verification PASS."

      - name: Run unit tests
        shell: bash
        run: |
          set -e

          if [ -x ./gradlew ]; then
            ./gradlew test
          else
            echo "ERROR: gradlew tidak ditemukan."
            exit 1
          fi

      - name: Run Android lint
        shell: bash
        run: |
          set -e
          ./gradlew lint

      - name: Confirm NO APK artifact
        shell: bash
        run: |
          set -e

          if find . -type f \
            \( -name '*.apk' -o -name '*.aab' \) \
            -not -path './.git/*' \
            | grep -q .; then

            echo "ERROR: APK/AAB ditemukan."
            exit 1
          fi

          echo "NO APK/AAB generated. TEST ONLY PASS."
