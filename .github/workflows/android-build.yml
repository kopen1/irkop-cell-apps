name: Android Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Android build - TEST DISABLED
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify API base URL
        shell: bash
        run: |
          set -e
          if grep -RIn \
            --exclude-dir=.git \
            --exclude='android-build.yml' \
            --exclude-dir=Docs \
            --exclude-dir=fix \
            'konter.irkop.workers.dev/api/v1' \
            app README.md; then
            echo "ERROR: production source masih menggunakan /api/v1."
            exit 1
          fi
          echo "API base URL PASS."

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          ./gradlew assembleDebug

      - name: Run lint
        shell: bash
        run: |
          set -e
          ./gradlew lint

      - name: Verify APK exists
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: irkop-cell-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Verify no committed APK artifact
        shell: bash
        run: |
          set -e
          if git ls-files | grep -qE '\.(apk|aab)$'; then
            echo "ERROR: APK/AAB ter-commit ke repository."
            exit 1
          fi
          echo "No committed APK/AAB PASS."
