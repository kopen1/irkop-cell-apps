name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test Login API
        shell: bash
        run: |
          set -e

          URL="https://konter.irkop.workers.dev/api/auth/login"

          echo "=== TEST LOGIN API ==="
          echo "Endpoint: $URL"
          echo "Username: demo"

          RESPONSE=$(curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            --connect-timeout 15 \
            --max-time 30 \
            -w '\nHTTP_STATUS:%{http_code}' \
            "$URL" \
            --data '{"username":"demo","password":"demodemo"}')

          STATUS=$(printf '%s\n' "$RESPONSE" | sed -n 's/^HTTP_STATUS://p')
          BODY=$(printf '%s\n' "$RESPONSE" | sed '/^HTTP_STATUS:/d')

          echo "HTTP STATUS: $STATUS"

          python3 - "$BODY" <<'PY'
          import json
          import sys

          try:
              data = json.loads(sys.argv[1])
          except Exception:
              print("ERROR: Response bukan JSON")
              print(sys.argv[1][:1000])
              raise SystemExit(1)

          if isinstance(data, dict):
              safe = dict(data)
              if "token" in safe:
                  safe["token"] = "[HIDDEN]"
              if "access_token" in safe:
                  safe["access_token"] = "[HIDDEN]"

              print(json.dumps(safe, indent=2, ensure_ascii=False))

              if "token" in data or "access_token" in data:
                  print("LOGIN TOKEN: ADA")
              else:
                  print("LOGIN TOKEN: TIDAK ADA")

              if "user" in data:
                  print("USER: ADA")
          PY

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Login API gagal."
            exit 1
          fi

          if ! printf '%s' "$BODY" | grep -q '"token"'; then
            echo "ERROR: Login berhasil tetapi token tidak ditemukan."
            exit 1
          fi

          echo "LOGIN API: OK"

      - name: Build Debug APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          chmod +x gradlew
          URL="${API_BASE_URL:-https://konter.irkop.workers.dev/api/}"
          echo "API_BASE_URL=$URL"
          ./gradlew assembleDebug -PAPI_BASE_URL="$URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: irkop-cell-debug
          path: app/build/outputs/apk/debug/*.apk
