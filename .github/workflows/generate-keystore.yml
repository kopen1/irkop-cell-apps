name: Generate Android Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate keystore settings
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -genkeypair                 -v                 -keystore "$RUNNER_TEMP/irkop-cell-release.jks"                 -storepass "$STORE_PASSWORD"                 -alias "$KEY_ALIAS"                 -keypass "$KEY_PASSWORD"                 -keyalg RSA                 -keysize 4096                 -validity 10000                 -dname "CN=IRKOP CELL, OU=Mobile, O=IRKOP CELL, L=Indonesia, C=ID"
          keytool -list -keystore "$RUNNER_TEMP/irkop-cell-release.jks"                 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: irkop-cell-release-keystore
          path: ${{ runner.temp }}/irkop-cell-release.jks
          retention-days: 7
          if-no-files-found: error
