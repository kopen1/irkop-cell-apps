name: Android Test Only

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Android tests - TEST ONLY
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify API base URL
        shell: bash
        run: |
          set -e

          if grep -RIn \
            --exclude-dir=.git \
            --exclude='android-build.yml' \
            --exclude-dir=Docs \
            --exclude-dir=fix \
            'konter.irkop.workers.dev/api/v1' \
            app README.md; then
            echo "ERROR: production source masih menggunakan /api/v1."
            exit 1
          fi

          echo "API base URL PASS."

      - name: Verify forbidden APK build commands
        shell: bash
        run: |
          set -e

          if grep -RInE \
            --exclude-dir=.git \
            --exclude='android-build.yml' \
            '(^|[^A-Za-z])(assembleDebug|assembleRelease|bundleRelease)([^A-Za-z]|$)' \
            .github/workflows; then
            echo "ERROR: workflow masih mengandung perintah APK build."
            exit 1
          fi

          echo "No APK build command PASS."

      - name: Verify source structure
        shell: bash
        run: |
          set -e

          test -f app/src/main/java/com/irkop/cell/data/ApiService.kt
          test -f app/src/main/java/com/irkop/cell/data/Repository.kt
          test -f app/src/main/java/com/irkop/cell/MainActivity.kt
          test -f app/src/androidTest/java/com/irkop/cell/LiveCrudE2ETest.kt

          echo "Source structure PASS."

      - name: Run unit tests
        shell: bash
        run: |
          set -e
          ./gradlew test

      - name: Run live Android login + CRUD E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Run lint
        shell: bash
        run: |
          set -e
          ./gradlew lint

      - name: Verify no committed APK artifact
        shell: bash
        run: |
          set -e

          if git ls-files | grep -qE '\.(apk|aab)$'; then
            echo "ERROR: APK/AAB ter-commit ke repository."
            exit 1
          fi

          echo "No committed APK/AAB PASS."
